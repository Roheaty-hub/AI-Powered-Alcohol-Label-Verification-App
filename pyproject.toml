[project]
name = "ttb-label-verifier"
version = "0.1.0"
description = "Prototype: verify alcohol beverage label images against COLA application data"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
